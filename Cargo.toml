[workspace]
members = [
  "packages/ozton",
  "packages/ozton-control",
  "packages/ozton-diagnostics",
  "packages/ozton-drivetrain",
  "packages/ozton-localization",
  "packages/ozton-math",
  "packages/ozton-motion",
  "packages/ozton-path-io",
  "packages/ozton-runtime",
  "packages/ozton-tools",
  "packages/ozton-ui",
  "packages/ozton-tracking"
]
resolver = "2"

[workspace.package]
repository = "https://github.com/gmhs-robotics/ozton"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arrayvec = { version = "0.7", default-features = false }
vexide = "0.9.0-beta.1"
ozton-control = { version = "0.4.0", path = "packages/ozton-control", default-features = false }
ozton-diagnostics = { version = "0.4.0", path = "packages/ozton-diagnostics", default-features = false }
ozton-drivetrain = { version = "0.4.0", path = "packages/ozton-drivetrain", default-features = false }
ozton-localization = { version = "0.4.0", path = "packages/ozton-localization", default-features = false }
ozton-math = { version = "0.4.0", path = "packages/ozton-math", default-features = false }
ozton-motion = { version = "0.4.0", path = "packages/ozton-motion", default-features = false }
ozton-path-io = { version = "0.4.0", path = "packages/ozton-path-io", default-features = false }
ozton-runtime = { version = "0.4.0", path = "packages/ozton-runtime", default-features = false }
ozton-ui = { version = "0.4.0", path = "packages/ozton-ui", default-features = false }
ozton-tracking = { version = "0.4.0", path = "packages/ozton-tracking", default-features = false }
glam = { version = "0.29.3", default-features = false, features = ["libm"] }
libm = "0.2"

[profile.release]
strip = true
# opt-level = "z"
opt-level = 3
lto = "fat"
