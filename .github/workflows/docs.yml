name: Publish the Ozton Book

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'book.toml'
      - 'docs/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ozton-book-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://docs.eli.best/
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment configuration
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo '::error::Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID for docs-production.'
            exit 1
          else
            echo '::notice::Deployment skipped because docs-production credentials are missing.'
          fi
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - name: Install mdBook
        if: steps.config.outputs.ready == 'true'
        run: cargo +stable install mdbook --version 0.5.4 --locked
      - name: Build and stage the book
        if: steps.config.outputs.ready == 'true'
        run: |
          mdbook build
          test -s target/book/index.html
          mkdir -p .vercel/output
          printf '%s\n' '{"version":3}' > .vercel/output/config.json
          mv target/book .vercel/output/static
      - name: Install Vercel CLI
        if: steps.config.outputs.ready == 'true'
        run: npm install --global vercel@66.2.0
      - name: Deploy the rendered book
        if: steps.config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          jq -n --arg orgId "$VERCEL_ORG_ID" --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId}' > .vercel/project.json
          vercel deploy --prebuilt --prod --yes --non-interactive
