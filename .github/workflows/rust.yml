name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          profile: minimal
          toolchain: nightly-2026-11-07
          components: rust-src, rustfmt
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo check --workspace --all-targets --locked --no-default-features --features ozton/recording
      - run: cargo test --workspace --all-targets --locked --no-default-features --features ozton/recording

      - run: cargo check -p ozton --locked --all-features
      - run: cargo check -p ozton --locked --no-default-features

  v5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [programmed, recording]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          profile: minimal
          toolchain: nightly-2026-11-07
          components: rust-src
      - run: cargo check -p ozton --examples --locked --target thumbv7a-vex-v5 --no-default-features --features ${{ matrix.mode }}

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: nightly-2026-11-07
          profile: minimal
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build
      - run: mdbook test
