name: Rust

on: [push, pull_request]

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Setup | Checkout
              uses: actions/checkout@v2

            - name: Setup | Toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  profile: minimal
                  toolchain: nightly-2026-11-07
                  components: rust-src

            - name: Check
              uses: actions-rs/cargo@v1
              with:
                  command: check
                  args: --target=thumbv7a-vex-v5

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Setup | Checkout
              uses: actions/checkout@v2

            - name: Setup | Toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  profile: minimal
                  toolchain: nightly-2026-11-07
                  components: rust-src

            - name: Check
              uses: actions-rs/cargo@v1
              with:
                  command: test
