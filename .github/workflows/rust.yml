name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          profile: minimal
          toolchain: nightly-2026-11-07
          components: rust-src, rustfmt
      - name: Verify platform-independent dependency boundaries
        run: |
          for package in ozton-math ozton-localization ozton-motion ozton-diagnostics ozton-tools; do
            if cargo tree --locked -p "$package" --all-features -e normal | grep -E 'vexide v|vex-sdk v'; then
              echo "$package must not depend on the VEX SDK"
              exit 1
            fi
          done
          cargo check --locked -p ozton-motion --all-features
          cargo check --locked -p ozton-localization --all-features
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

      - run: cargo check -p ozton --locked --all-features
      - run: cargo check -p ozton --locked --no-default-features

  v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          profile: minimal
          toolchain: nightly-2026-11-07
          components: rust-src
      - run: cargo check -p ozton --examples --locked --target thumbv7a-vex-v5
