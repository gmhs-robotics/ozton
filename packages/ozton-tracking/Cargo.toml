[package]
name = "ozton-tracking"
description = "Tracking models for ozton."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
ozton-diagnostics = { workspace = true, optional = true }
arrayvec = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
glam = { workspace = true }
ozton-math = { workspace = true }
vex-sdk = { version = "0.29.0", optional = true }
vexide = { workspace = true, optional = true }

[features]
default = ["vex"]
vex = ["dep:ozton-diagnostics", "dep:vexide", "dep:vex-sdk"]
logging = ["ozton-diagnostics?/logging"]

[package.metadata.docs.rs]
targets = ["thumbv7a-vex-v5"]
cargo-args = [
    "-Zbuild-std=std,panic_abort",
    "-Zbuild-std-features=compiler-builtins-mem,panic-unwind",
]
