[package]
name = "ozton-tracking"
description = "Tracking models for ozton."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[dependencies]
arrayvec = { workspace = true }
glam = { workspace = true }
ozton-math = { workspace = true }
ozton-diagnostics = { workspace = true, optional = true }
vexide = { workspace = true }

[features]
logging = ["dep:ozton-diagnostics", "ozton-diagnostics/logging"]

[[bench]]
name = "localization"
harness = false

[package.metadata.docs.rs]
targets = ["thumbv7a-vex-v5"]
cargo-args = [
    "-Zbuild-std=std,panic_abort",
    "-Zbuild-std-features=compiler-builtins-mem,panic-unwind",
]
