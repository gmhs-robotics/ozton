[package]
name = "ozton-drivetrain"
description = "Drivetrain models for ozton."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
glam = { workspace = true }
vexide = { workspace = true, optional = true }
ozton-math = { workspace = true }
ozton-localization = { workspace = true }
ozton-diagnostics = { workspace = true }
ozton-tracking = { workspace = true }

[features]
default = ["vex"]
vex = ["dep:vexide", "ozton-tracking/vex"]
logging = ["ozton-diagnostics/logging", "ozton-tracking/logging"]

[target.'cfg(not(target_os = "vexos"))'.dev-dependencies]
vex-sdk-mock = "0.2.0"

[[test]]
name = "tracking_startup"
required-features = ["vex"]

[package.metadata.docs.rs]
targets = ["thumbv7a-vex-v5"]
cargo-args = [
    "-Zbuild-std=std,panic_abort",
    "-Zbuild-std-features=compiler-builtins-mem,panic-unwind",
]
