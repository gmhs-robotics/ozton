[package]
name = "ozton-motion"
description = "Motion control algorithms in ozton."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
ozton-localization = { workspace = true }
glam = { workspace = true }
ozton-control = { workspace = true }
ozton-runtime = { workspace = true, optional = true }
ozton-drivetrain = { workspace = true }
ozton-math = { workspace = true }
ozton-tracking = { workspace = true, optional = true }

[dev-dependencies]
vexide = { workspace = true }
vex-sdk-mock = "0.2.0"

[features]
default = ["vex"]
vex = ["dep:ozton-runtime", "dep:ozton-tracking", "ozton-drivetrain/vex", "ozton-tracking/vex"]
logging = ["vex", "ozton-runtime/logging"]

[[test]]
name = "mock_robot_e2e"
required-features = ["vex"]

[[test]]
name = "tracking_startup"
required-features = ["vex"]

[package.metadata.docs.rs]
targets = ["thumbv7a-vex-v5"]
cargo-args = [
    "-Zbuild-std=std,panic_abort",
    "-Zbuild-std-features=compiler-builtins-mem,panic-unwind",
]
