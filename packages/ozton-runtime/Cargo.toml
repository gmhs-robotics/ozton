[package]
name = "ozton-runtime"
description = "Shared VEX competition runtime utilities for Ozton."
repository.workspace = true
license.workspace = true
version = "0.4.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
ozton-localization = { workspace = true }
ozton-ui = { workspace = true }
ozton-diagnostics = { workspace = true }
vexide = { workspace = true }
ozton-math = { workspace = true }
ozton-drivetrain = { workspace = true, features = ["vex"] }
ozton-tracking = { workspace = true, features = ["vex"] }

[target.'cfg(not(target_os = "vexos"))'.dev-dependencies]
vex-sdk-mock = "0.2.0"

[features]
logging = ["ozton-diagnostics/logging", "ozton-tracking/logging", "ozton-localization/logging"]
