[package]
name = "ozton-localization"
description = "Pose estimation and field maps for Ozton."
repository.workspace = true
license.workspace = true
version = "0.4.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
ozton-diagnostics = { workspace = true, optional = true }
glam = { workspace = true }
ozton-tracking = { workspace = true }
