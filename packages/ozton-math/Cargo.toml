[package]
name = "ozton-math"
description = "Math utilities in ozton."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[dependencies]
glam = { workspace = true }
libm = { workspace = true }

[package.metadata.docs.rs]
targets = ["thumbv7a-vex-v5"]
cargo-args = [
    "-Zbuild-std=std,panic_abort",
    "-Zbuild-std-features=compiler-builtins-mem,panic-unwind",
]
