[package]
name = "ozton"
description = "Programmed autonomous and robot control for VEX V5 with vexide."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
readme = "../../README.md"
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[dev-dependencies]
vexide = { workspace = true, features = ["full", "default-sdk"] }

[dependencies]
ozton-control = { workspace = true }
ozton-diagnostics = { workspace = true }
ozton-runtime = { workspace = true }
ozton-drivetrain = { workspace = true }
ozton-math = { workspace = true }
ozton-motion = { workspace = true }
ozton-tracking = { workspace = true }

[features]
sd-logging = ["ozton-runtime/sd-logging"]
