[package]
name = "ozton"
description = "Programmed autonomous and robot control for VEX V5 with vexide."
repository.workspace = true
authors = ["elijah629"]
license.workspace = true
readme = "../../README.md"
categories = ["science::robotics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[lints]
workspace = true

[dev-dependencies]
vexide = { workspace = true, features = ["full", "default-sdk"] }

[target.'cfg(not(target_os = "vexos"))'.dev-dependencies]
vex-sdk-mock = "0.2.0"

[dependencies]
vexide = { workspace = true }
ozton-ui = { workspace = true }
ozton-localization = { workspace = true }
ozton-diagnostics = { workspace = true }
ozton-runtime = { workspace = true }
ozton-drivetrain = { workspace = true, features = ["vex"] }
ozton-math = { workspace = true }
ozton-motion = { workspace = true, features = ["vex"] }
ozton-tracking = { workspace = true, features = ["vex"] }

[features]
logging = ["ozton-runtime/logging", "ozton-localization/logging", "ozton-motion/logging"]
