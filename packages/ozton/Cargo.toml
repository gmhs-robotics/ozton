[package]
name = "ozton"
description = "A meta-framework for building compeition robots with vexide."
repository = "https://github.com/gmhs-robotics/ozton/"
authors = ["elijah629"]
license = "MIT"
readme = "../../README.md"
categories = ["science::robotics", "no-std", "mathematics", "embedded"]
keywords = ["vex", "vexide", "vex-robotics", "robotics", "autonomous"]
version = "0.4.0"
edition = "2024"

[dev-dependencies]
vexide = { workspace = true, features = ["full", "default-sdk"] }

[dependencies]
ozton-control = { workspace = true }
ozton-diagnostics = { workspace = true }
ozton-runtime = { workspace = true }
ozton-derive = { workspace = true, optional = true }
ozton-drivetrain = { workspace = true }
ozton-math = { workspace = true }
ozton-motion = { workspace = true, optional = true }
ozton-record = { workspace = true, optional = true }
ozton-tracking = { workspace = true }

[features]
default = ["programmed"]
programmed = ["dep:ozton-motion"]
recording = ["dep:ozton-derive", "dep:ozton-record"]

[[example]]
name = "full"
required-features = ["recording"]

[[example]]
name = "gps_voltage_tracking"
required-features = ["recording"]

[[test]]
name = "recordable_drivetrain_public_usage"
required-features = ["recording"]

[[test]]
name = "recorded_robot_public_usage"
required-features = ["recording"]

[package.metadata.docs.rs]
targets = ["armv7a-none-eabi"] # Not actually, but this is at least close.

[[example]]
name = "programmed"
required-features = ["programmed"]
